<!DOCTYPE html>

<html lang="en-GB" data-theme="dark" data-theme-mode="dark" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>{{title}}</title>
  <meta name="author" content="Sebastien Rousseau">
  <meta name="description" content="{{description}}">
  <meta name="geo.region" content="GB-BNE">
  <meta name="geo.placename" content="Barnet, London">
  <meta name="geo.position" content="51.651161;-0.17987">
  <meta name="ICBM" content="51.651161, -0.17987">
  {{#block "meta_robots"}}<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">{{/block}}
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://formspree.io; img-src 'self' data: https:; media-src 'self'; style-src 'self'; font-src 'self'; form-action 'self' https://formspree.io mailto:; frame-ancestors 'none'; base-uri 'self';" />

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="White Collar Boxing Training">
  <meta property="og:locale" content="en_GB">
  <meta property="og:title" content="{{title}} | White Collar Boxing Training">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{banner}}">
  <meta property="og:url" content="{{permalink}}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}} | White Collar Boxing Training">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{banner}}">

  <link rel="alternate" href="{{permalink}}" hreflang="en-gb" />
  <link rel="alternate" href="{{permalink}}" hreflang="en" />
  <link rel="canonical" href="{{permalink}}" />
  <link rel="icon" type="image/svg+xml" href="{{logo}}" />
  <link rel="icon" type="image/png" href="/images/favicon/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/images/favicon/favicon-16x16.png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/images/icon/apple-touch-icon-180x180.png" sizes="180x180" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="alternate" type="application/rss+xml" href="/rss.xml" title="White Collar Boxing Training RSS Feed" />
  <link rel="stylesheet" href="/skeletonic.min.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme-init.js"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": ["ExerciseGym", "SportsActivityLocation", "LocalBusiness"],
        "@id": "https://whitecollarboxingtraining.com/#gym",
        "name": "White Collar Boxing Training",
        "alternateName": ["White Collar Boxing London", "White Collar Boxing Barnet"],
        "url": "https://whitecollarboxingtraining.com/",
        "logo": "https://whitecollarboxingtraining.com/images/logo/whitecollarboxingtraining.svg",
        "image": "https://whitecollarboxingtraining.com/images/banner/banner.webp",
        "description": "Premier white collar boxing training in Barnet, North London and the UK. Beginner, amateur, and advanced boxing coaching and 1-to-1 executive fight camps led by Gary Foley and Commonwealth Games Gold Medallist Sean Murphy.",
        "telephone": "+44-7749-116927",
        "priceRange": "££",
        "currenciesAccepted": "GBP",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Anchor Hall, Bulwer Rd",
          "addressLocality": "Barnet, London",
          "addressRegion": "Greater London",
          "postalCode": "EN5 5EX",
          "addressCountry": "GB"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 51.651161,
          "longitude": -0.17987
        },
        "areaServed": [
          { "@type": "City", "name": "London" },
          { "@type": "AdministrativeArea", "name": "Barnet" },
          { "@type": "Country", "name": "United Kingdom" }
        ],
        "employee": [
          {
            "@type": "Person",
            "@id": "https://whitecollarboxingtraining.com/trainers/#gary-foley",
            "name": "Gary Foley",
            "jobTitle": "Head White Collar Boxing Coach",
            "telephone": "+44-7749-116927",
            "image": "https://whitecollarboxingtraining.com/images/other/gary.webp",
            "description": "Over 20 years of white collar boxing experience in London and the UK, and 9+ years as a qualified boxing trainer."
          },
          {
            "@type": "Person",
            "@id": "https://whitecollarboxingtraining.com/trainers/#sean-murphy",
            "name": "Sean Murphy",
            "jobTitle": "Senior Championship Boxing Coach",
            "telephone": "+44-7729-980677",
            "image": "https://whitecollarboxingtraining.com/images/other/sean.webp",
            "award": [
              "Commonwealth Games Gold Medallist",
              "British Lonsdale Belt Outright Winner",
              "World Title Contender"
            ],
            "description": "Commonwealth Games Gold Medallist, British Lonsdale Belt Outright winner, and World Title contender with decades of professional boxing and fitness coaching experience."
          }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "White Collar Boxing Programmes",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Basic / Beginner Boxing Training",
                "description": "Foundational stance, footwork, defence, pad work, and cardiovascular conditioning for complete beginners."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Amateur / Mid-Level Boxing Training",
                "description": "Combination punching, defensive head movement, controlled technical sparring, and 8-to-12-week charity bout preparation."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Advanced Competitive Fight Camp",
                "description": "High-intensity championship rounds, tactical ring generalship, nutrition periodisation, and 1-to-1 corner preparation."
              }
            }
          ]
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://whitecollarboxingtraining.com/#website",
        "url": "https://whitecollarboxingtraining.com/",
        "name": "White Collar Boxing Training",
        "description": "{{description}}",
        "inLanguage": "en-GB",
        "publisher": { "@id": "https://whitecollarboxingtraining.com/#gym" }
      },
      {
        "@type": "WebPage",
        "@id": "{{permalink}}#webpage",
        "url": "{{permalink}}",
        "name": "{{title}}",
        "description": "{{description}}",
        "inLanguage": "en-GB",
        "isPartOf": { "@id": "https://whitecollarboxingtraining.com/#website" },
        "about": { "@id": "https://whitecollarboxingtraining.com/#gym" }
      }
    ]
  }
  </script>
</head>
<body class="style-visage">
  <a class="skip-link" href="#main">Skip to main content</a>
  {{> header}}
  <main id="main" class="style-visage" aria-label="Main content">{{#block "main"}}{{/block}}</main>
  {{> footer}}
  <script src="/main.js" defer></script>
</body>
</html>
