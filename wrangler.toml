# Cloudflare Pages / Workers configuration for whitecollarboxingtraining.com
# PQC posture: TLS 1.3 with X25519+ML-KEM-768 hybrid key-exchange suite.

name = "whitecollarboxingtraining"
compatibility_date = "2026-10-31"
pages_build_output_dir = "public"

# Custom domains routed via Cloudflare DNS & Edge
routes = [
  { pattern = "whitecollarboxingtraining.com", custom_domain = true },
  { pattern = "www.whitecollarboxingtraining.com", custom_domain = true }
]

[vars]
SITE_URL = "https://whitecollarboxingtraining.com"
CANONICAL_HOST = "whitecollarboxingtraining.com"
ENVIRONMENT = "production"

[[headers]]
  for = "/*"
  [headers.values]
    "Strict-Transport-Security" = "max-age=63072000; includeSubDomains; preload"
    "Content-Security-Policy" = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self' https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests"
    "X-Content-Type-Options" = "nosniff"
    "X-Frame-Options" = "DENY"
    "Referrer-Policy" = "strict-origin-when-cross-origin"
    "Permissions-Policy" = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    "Cross-Origin-Opener-Policy" = "same-origin"
    "Cross-Origin-Resource-Policy" = "same-site"
    "X-Permitted-Cross-Domain-Policies" = "none"

[[headers]]
  for = "/images/*"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    "Cache-Control" = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    "Content-Type" = "text/plain; charset=utf-8"
    "Cache-Control" = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    "Content-Type" = "text/plain; charset=utf-8"
    "Cache-Control" = "public, max-age=3600"
